[package]
name = "ron-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Wasm Bindings for RON"
repository = "https://github.com/sorairolake/ron-wasm"
license = "Apache-2.0 OR MIT"
keywords = ["ron"]
categories = ["encoding", "wasm"]
include = ["/LICENSES", "/README.md", "/src"]
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ron = { version = "0.12.1", features = ["indexmap"] }
serde = "1.0.228"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.108"

[dev-dependencies]
wasm-bindgen-test = "0.3.58"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
